
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdontoGestão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <aside>
        <nav>
            <section class="principal">
                <img id="logo" src="imgs/dente.png" alt="logo">
                <h2>OdontoGestão</h2>
            </section>
            <hr>
            <ul>
                <li><a href="index.html" class="ativo">Dashboard</a></li>
                <li><a href="pacientes.html">Pacientes</a></li>
                <li><a href="agendamentos.html">Agendamentos</a></li>
            </ul>
        </nav>
    </aside>

    <main>
        <header>
            <h1>Dashboard</h1>
            <p>Bem-vindo ao OdontoGestão</p>
        </header>
        <div class="dashboard-cards">
            <section class="card">
                <img class="icone-card" src="imgs/comercial.svg" alt="img card pacientes">
                <h3>Pacientes</h3>
                <p id="total-pacientes">Número dos pacientes</p>
            </section>
            <section class="card">
                <img class="icone-card" src="imgs/relogio-calendario.svg" alt="img card Consultas">
                <h3>Consultas Hoje</h3>
                <p id="total-consultas">Número de consultas</p>
            </section>
        </div>
        <section class="upcoming-appointments">
                <h3>Próximos agendamentos</h3>
                <ul>
                    <li class="agendamento">
                    <time datetime="09:00">09:00</time>
                    <span>Maria Oliveira</span>
                    </li>
                </ul>
        </section>
            
    </main>
    <script src="script.js"></script>
</body>
</html>
