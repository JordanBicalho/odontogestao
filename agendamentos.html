<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdontoGestão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <aside>
        <nav>
            <section class="principal">
                <img id="logo" src="imgs/dente.png" alt="logo">
                <h2>OdontoGestão</h2>
            </section>
            <hr>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="pacientes.html">Pacientes</a></li>
                <li><a href="agendamentos.html" class="ativo">Agendamentos</a></li>
            </ul>
        </nav>
    </aside>
    <main>
        <header class="cabecalho">
            <div>
                <h1>Agendamentos</h1>
                <p>Gerencie os agendamentos da sua clínica</p>
            </div>
            <button class="botao-primario">Novo Agendamento</button>
        </header>         
        <form class="filtros">
            <label>
                Data
                <input type="date">
            </label>
            <label>
                Paciente
                <input type="text" placeholder="Buscar paciente...">
            </label>
            <label>
                Status
                <select>
                    <option>Todos</option>
                    <option>Agendado</option>
                    <option>Confirmado</option>
                    <option>Cancelado</option>
                </select>
            </label>
            <button type="button" class="botao-primario">Pesquisar</button>
        </form>

        <div class="titulo-lista">
            <h2>Agendamentos do dia</h2>
            <time datetime="2026-11-24">24 de Novembro de 2026</time>
        </div>
        <ul class="lista-agendamentos" id="lista-agendamentos">
        </ul>       
    </main>
    <script src="dados.js"></script>
    <script src="agendamentos.js"></script>
</body>
</html>
